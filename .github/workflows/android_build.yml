name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push makes an in-flight run obsolete. Cancel it rather than paying
# for two builds and waiting on the stale one's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # One Gradle invocation instead of three.
    #
    # `./gradlew build` runs assemble (every variant, including release) plus
    # check (lint and unit tests), so the old separate `assembleRelease` step
    # was a pure no-op re-run -- run #31583626623 shows minifyReleaseWithR8
    # already executing inside `build`.
    #
    # `bundleRelease` is the one thing `build` does not cover, since bundle
    # tasks are not part of assemble. Requesting it in the SAME invocation lets
    # Gradle share compileReleaseKotlin and minifyReleaseWithR8 with the
    # assemble path instead of re-resolving and re-running them, and pays
    # configuration cost once rather than three times.
    - name: Build, test and package
      run: ./gradlew build bundleRelease --build-cache

    # The release APK is UNSIGNED and cannot be installed on a device. The
    # debug APK is signed with the auto-generated debug keystore, so this is
    # the artifact to actually download and run.
    - name: Upload debug APK (installable)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
