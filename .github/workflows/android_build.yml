name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push makes an in-flight run obsolete. Cancel it rather than paying
# for two builds and waiting on the stale one's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # One Gradle invocation instead of three.
    #
    # `./gradlew build` runs assemble (every variant, including release) plus
    # check (lint and unit tests), so the old separate `assembleRelease` step
    # was a pure no-op re-run -- run #31583626623 shows minifyReleaseWithR8
    # already executing inside `build`.
    #
    # `bundleRelease` is the one thing `build` does not cover, since bundle
    # tasks are not part of assemble. Requesting it in the SAME invocation lets
    # Gradle share compileReleaseKotlin and minifyReleaseWithR8 with the
    # assemble path instead of re-resolving and re-running them, and pays
    # configuration cost once rather than three times.
    - name: Build, test and package
      run: ./gradlew build bundleRelease --build-cache

    # every upload sets if-no-files-found: error. The default is `warn`, which
    # keeps the step green while uploading nothing -- that silently dropped the
    # release APK for a whole run when adding a signingConfig renamed the output
    # from app-release-unsigned.apk to app-release.apk.
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    # Glob rather than a literal name: the filename tracks whether a
    # signingConfig is present, so pinning it couples this step to signing setup.
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: error
